name: Android DEV APK Build

on:
  push:
    branches:
      - DEV_1.0.0
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: DEV_1.0.0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Setup Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      # Genera solo l'APK (assembleRelease) invece del Bundle AAB
      - name: Build Release APK
        run: ./gradlew assembleRelease

      # Carica il file APK generato tra gli Artifacts di GitHub
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkoutTracker-DEV_1.0.1-APK
          path: app/build/outputs/apk/release/app-release.apk

      # Carica il file mapping.txt per il de-offuscamento
      - name: Upload Mapping File Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mapping-DEV_1.0.1
          path: app/build/outputs/mapping/release/mapping.txt