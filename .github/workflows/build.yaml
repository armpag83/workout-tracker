name: Build Release AAB

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configurazione Java JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      # Ripristina il keystore permanente dal Secret di GitHub
      - name: Decodifica Keystore permanente
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > permanent-release.keystore

      # Prepara ambiente debug temporaneo per la compilazione
      - name: Prepara ambiente debug
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      # Compila l'App Bundle (.aab)
      - name: Genera AAB
        run: gradle bundleRelease

      # Rimuove la firma temporanea di debug
      - name: Rimuovi firma di debug
        run: zip -d app/build/outputs/bundle/release/app-release.aab "META-INF/*" || true

      # Firma l'AAB con la chiave permanente ripristinata
      - name: Firma AAB con chiave permanente
        run: |
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore permanent-release.keystore \
            -storepass ArmPagPass2026! \
            -keypass ArmPagPass2026! \
            app/build/outputs/bundle/release/app-release.aab \
            armpagKey

      # Carica l'AAB e il file di mapping (deoffuscamento) negli Artifacts
      - name: Carica Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-artifacts
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt