name: Build Release AAB

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configurazione Java JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      # Genera un Keystore e un certificato PEM usando dati fissi
      - name: Prepara Keystore e Certificato PEM
        run: |
          keytool -genkeypair -v \
            -keystore permanent-release.keystore \
            -alias armpagKey \
            -keypass ArmPagPass2026! \
            -storepass ArmPagPass2026! \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Armando Pagliara, OU=Dev, O=ArmPag, C=IT"
          
          # Esporta il certificato PEM per Google Play Console
          keytool -export -rfc \
            -keystore permanent-release.keystore \
            -alias armpagKey \
            -file upload_certificate.pem \
            -storepass ArmPagPass2026!

      # Prepara ambiente debug temporaneo per Gradle
      - name: Prepara ambiente debug
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      # Compila l'App Bundle (.aab)
      - name: Genera AAB
        run: gradle bundleRelease

      # Rimuove firma di debug
      - name: Rimuovi firma di debug
        run: zip -d app/build/outputs/bundle/release/app-release.aab "META-INF/*" || true

      # Firma l'AAB con la chiave permanente
      - name: Firma AAB con chiave permanente
        run: |
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore permanent-release.keystore \
            -storepass ArmPagPass2026! \
            -keypass ArmPagPass2026! \
            app/build/outputs/bundle/release/app-release.aab \
            armpagKey

      # Carica l'AAB, il Keystore e il Certificato PEM negli Artifacts
      - name: Carica Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-and-keys
          path: |
            app/build/outputs/bundle/release/app-release.aab
            permanent-release.keystore
            upload_certificate.pem