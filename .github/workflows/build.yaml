name: Android DEV APK Build

on:
  push:
    branches:
      - DEV_1.0.0
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Fissata la versione di Gradle a 8.7 compatibile con AGP 8.2.2
      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Setup Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkoutTracker-DEV_1.0.1-APK
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload Mapping File Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mapping-DEV_1.0.1
          path: app/build/outputs/mapping/release/mapping.txt