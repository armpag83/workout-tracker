name: Build Release AAB

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configurazione Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      # Prepara il debug keystore per la compilazione Gradle
      - name: Prepara ambiente di build
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      # Compila l'App Bundle (.aab)
      - name: Genera AAB
        run: gradle bundleRelease

      # Rimuove la firma di debug precedente per evitare la doppia catena di certificati
      - name: Rimuovi firma di debug precedente
        run: |
          zip -d app/build/outputs/bundle/release/app-release.aab "META-INF/*" || true

      # Genera la chiave di Release ed esegue l'unica firma ufficiale
      - name: Firma AAB con chiave di Release
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias armpagKey -keypass ArmPagPass2026! -storepass ArmPagPass2026! -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Armando Pagliara, OU=Dev, O=ArmPag, C=IT"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.keystore -storepass ArmPagPass2026! -keypass ArmPagPass2026! app/build/outputs/bundle/release/app-release.aab armpagKey

      # Carica l'Artifact AAB con firma singola
      - name: Carica Artifact AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/