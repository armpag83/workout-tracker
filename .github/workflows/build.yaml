name: Build Release AAB

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Permette l'avvio manuale da GitHub Web

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configurazione Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Forza l'uso di Gradle 8.4 compatibile con l'Android Gradle Plugin del progetto
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      # Compila l'App Bundle (.aab)
      - name: Genera AAB di Release
        run: gradle bundleRelease

      # Salva il file .aab negli Artifacts
      - name: Carica Artifact AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/